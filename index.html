<html lang="pt-BR">
  <head>

    <meta name="theme-color" content="#0d0b09" />

      rel="preload"

      rel="preload"
      as="image"
      href="/img/loja-fachada-1600.webp"
      imagesrcset="/img/loja-fachada-640.webp 640w, /img/loja-fachada-1024.webp 1024w, /img/loja-fachada-1600.webp 1600w"
      imagesizes="100vw"
      fetchpriority="high"
    />
